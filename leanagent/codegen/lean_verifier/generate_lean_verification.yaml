        # Advanced Predicates (#20–22)

        > Back to [index](index.md)

        ---

        <a id="20"></a>
        ## 20. `.ext key` — Extensible Predicate

        **PredicateType**: `.ext (key : PredicateKey)`
        **No shorthand function** — requires direct construction of `VariablePredicateRequirement`.
        **Semantics**: Provided by `PredicateRegistry` at runtime.
        **Use case**: Advanced scenarios — Dict value predicates for parallel submodules (`DictAllValuesPredicate`), etc.

        ### IR JSON format

        There are **two ways** to reference an ext predicate in node predicates:

        #### Option A: Direct ext_key (specify the generated Lean Key name)
        ```json
        {"kind": "ext", "ext_key": "myDictPredKey"}
        ```

        #### Option B: ext_ref (index into workflow-level ext_predicates list, auto-resolved)
        ```json
        {"kind": "ext", "ext_ref": 0}
        ```
        `ext_ref` is an integer index into the `ext_predicates` array defined at the workflow level.
        During code generation, `ext_ref` is automatically resolved to the corresponding `ext_key`
        (`{lean_def_name}Key`), so you don't need to manually track the generated Lean names.

        ### Workflow-level ext_predicates

        The `DictAllValuesPredicate` definitions are specified in the workflow IR's `ext_predicates` list:

        ```json
        {
        "ext_predicates": [
            {
            "family": "dictAllValues",
            "value_predicates": [
                {"kind": "isValidJson"},
                {"kind": "matchesJsonSchema", "schema": {"kind": "jObject", "fields": [["bibtex", {"kind": "jString"}]]}}
            ],
            "dict_var_name": "all_results",
            "lean_def_name": "myDictPred"
            }
        ]
        }
        ```

        Fields:
        - `family`: Must be `"dictAllValues"` for `DictAllValuesPredicate`
        - `value_predicates`: List of `PredicateIR` that each dict value must satisfy
        - `dict_var_name`: The variable name this predicate targets (optional)
        - `lean_def_name`: Custom Lean definition name (optional; defaults to `{prefix}_dictAllValuesPred_{i}`)

        ### Generated Lean code

        TaskPlanToLean.py generates these definitions from each `ext_predicates` entry:

        ```lean
        -- DictAllValuesPredicate: all_results
        def myDictPred : DictAllValuesPredicate := {
        dictValuePredicates := [.isValidJson, .matchesJsonSchema mySchema]
        dictVarName := "all_results"
        }
        def myDictPredKey : PredicateKey := myDictPred.toPredicateKey
        def myDictPredPredType : PredicateType := .ext myDictPredKey

        def writerRegistry : PredicateRegistry :=
        makeDictAllValuesRegistry [myDictPred]
        ```

        ### Using in node predicates

        Nodes reference the ext predicate via `ext_key` or `ext_ref`:

        ```json
        {
        "postcond_extra": [
            {
            "var_name": "all_results",
            "predicate": {
                "kind": "predicateAnd",
                "left": {"kind": "matchesJsonSchema", "schema": {"kind": "jObject", "fields": []}},
                "right": {"kind": "ext", "ext_ref": 0}
            }
            }
        ]
        }
        ```

        This generates:
        ```lean
        postcondVariables := [
        ⟨"all_results", .predicateAnd (.matchesJsonSchema (.jObject [])) (.ext myDictPredKey)⟩
        ]
        ```

        ### Full Lean example

        ```lean
        -- Step 1: Define DictAllValuesPredicate
        def myDictPred : DictAllValuesPredicate := {
        dictValuePredicates := [.isValidJson, .matchesJsonSchema mySchema]
        dictVarName := "all_results"
        }

        -- Step 2: Convert to PredicateKey and PredicateType
        def myDictPredKey : PredicateKey := myDictPred.toPredicateKey
        def myDictPredPredType : PredicateType := .ext myDictPredKey

        -- Step 3: Use in precond (direct construction)
        def semNode3 : SemanticWorkflowNode := {
        baseNode := ...
        precondVariables := [
            { varName := "all_results"
            requiredPredicate := myDictPredPredType }
        ]
        postcondVariables := [ ... ]
        }

        -- Step 4: Register in the Registry (for verify to use)
        def myRegistry : PredicateRegistry :=
        makeDictAllValuesRegistry [myDictPred]

        -- Step 5: Pass registry during verification
        theorem myGraph_sound :
            mySemanticGraph.isSemanticallySoundBool myRegistry = true := by
        native_decide
        ```

        **Source**: `Verification_extract_citation.lean` — `sc_semNode2`, `sc_semNode3`, `searchCitationsRegistry`

        ---

        <a id="21"></a>
        ## 21. `varPredicateAnd` — Predicate Conjunction

        **PredicateType**: `.predicateAnd p₁ p₂`
        **Signature**: `varPredicateAnd (varName : String) (pred₁ pred₂ : PredicateType)`
        **Semantics**: `p₁.toProp env name ∧ p₂.toProp env name`
        **Use case**: A single variable must satisfy multiple conditions simultaneously.
        **IR JSON**: `{"kind": "predicateAnd", "left": {"kind": "isValidJson"}, "right": {"kind": "matchesJsonSchema", "schema": {…}}}`

        ```lean
        -- Example: Variable must be valid JSON AND match a specific schema
        def semNode : SemanticWorkflowNode := {
        baseNode := ...
        precondVariables := [
            varPredicateAnd "data" .isValidJson (.matchesJsonSchema mySchema)
        ]
        postcondVariables := [ ... ]
        }
        ```

        **Note**: In most cases, you can use two separate `VariablePredicateRequirement` entries instead:

        ```lean
        -- Equivalent (and more common) pattern
        precondVariables := [
            varIsValidJson "data",
            varIsValidJsonSchema "data" mySchema
        ]
        ```

        ---

        <a id="22"></a>
        ## 22. `varPredicateOr` — Predicate Disjunction

        **PredicateType**: `.predicateOr p₁ p₂`
        **Signature**: `varPredicateOr (varName : String) (pred₁ pred₂ : PredicateType)`
        **Semantics**: `p₁.toProp env name ∨ p₂.toProp env name`
        **Use case**: Variable needs to satisfy at least one of two conditions.
        **IR JSON**: `{"kind": "predicateOr", "left": {"kind": "isValidURL"}, "right": {"kind": "isValidFilePath"}}`

        ```lean
        -- Example: Source path can be either a URL or a file path
        def semNode : SemanticWorkflowNode := {
        baseNode := ...
        precondVariables := [
            varPredicateOr "source" .isValidURL .isValidFilePath
        ]
        postcondVariables := [ ... ]
        }
        ```
    graph_predicate_catalog: |
        # Graph-Level Predicate Catalog

        > Requirements should be based on the **inherent nature of the task goal**,
        > NOT on whether the plan already implements the corresponding structure.
        > If the task inherently needs retry but the plan lacks a loop, that is a
        > legitimate finding — the plan is structurally insufficient.

        **CRITICAL: DO NOT include `"exitFactsConfirmed"`** — it is always checked implicitly.

        ## 1. `"pathCoverage"` — ALWAYS required
        At least one contributing node reaches every exit node.
        Rule: Include for EVERY sub-goal unconditionally.

        ## 2. `"retryRobustness"` — Required for non-deterministic sub-goals needing EXPLICIT structural retry
        At least one contributing node is inside a retry loop (while/for_each).
        Reasoning: Does this sub-goal need a guaranteed, explicit retry mechanism in the workflow structure?
        - Require if: the sub-goal's failure is expected and the workflow MUST structurally loop back
          (e.g., iterative search with explicit convergence check, multi-attempt API polling)
        - Skip if: LLM implicit retry within a single step is sufficient (see `implicitRetryCapability`)
        - Skip if: deterministic operations that cannot fail

        ## 3. `"implicitRetryCapability"` — Required for non-deterministic sub-goals where LLM can self-correct
        At least one contributing node supports multi-turn LLM interaction (step, task, call, etc.).
        This is auto-detected based on step type — non-deterministic nodes get this annotation automatically.
        Reasoning: Can the LLM retry and self-correct within a single multi-turn step?
        - Require if: code generation/modification, bug fixing, search, data extraction, any task
          where the LLM can observe failure and adjust within the same step
        - Skip if: the sub-goal is deterministic (file read, variable set, counter increment)
        - Skip if: the sub-goal is a terminal action (final submission, return value)

        ## 4. `"verificationCoverage"` — Required for verifiable artifacts
        A SEPARATE verification node (different from contributor) exists after the contributing node. A node CANNOT verify itself.
        Reasoning: Does this sub-goal produce an artifact whose correctness can be independently checked?
        - Require if: code fix (testable), generated output (validatable), data extraction (cross-checkable), config change (smoke-testable)
        - Skip if: pure exploration, final submission (terminal), setup/initialization, overhead steps

        ## Retry Strategy Guide
        `retryRobustness` and `implicitRetryCapability` address different retry needs:
        - **`implicitRetryCapability`**: LLM can self-correct within a single step (most common for agentic tasks)
        - **`retryRobustness`**: Workflow structurally loops back (needed when explicit convergence checks are required)
        For most agentic sub-goals, `implicitRetryCapability` alone is sufficient.
        Use `retryRobustness` only when the workflow MUST have an explicit retry loop.

        ## Examples
        | Sub-goal nature | required_graph_predicates |
        |----------------|--------------------------|
        | Read and understand a codebase | `["pathCoverage"]` |
        | Implement a bug fix | `["pathCoverage", "implicitRetryCapability", "verificationCoverage"]` |
        | Reproduce an issue | `["pathCoverage", "implicitRetryCapability"]` |
        | Run tests to verify a fix | `["pathCoverage"]` |
        | Generate and submit a patch | `["pathCoverage"]` |
        | Write a research paper section | `["pathCoverage", "implicitRetryCapability", "verificationCoverage"]` |
        | Extract data from a web page | `["pathCoverage", "implicitRetryCapability"]` |
        | Iterative search with convergence | `["pathCoverage", "retryRobustness"]` |
        | Parse a deterministic config file | `["pathCoverage"]` |


workflow:
    - task:
        name: "setup_dirs"
        instruction: |
            Execute Python:
            ```python
            import os, json
            os.makedirs("{{output_dir}}/modules", exist_ok=True)
            with open("{{output_dir}}/verified_registry.json", "w") as f:
                json.dump(json.loads('''{{already_verified_modules}}'''), f, indent=2)
            print("Directories created, registry initialized.")
            ```
            Say "OK" if no error raised.
        save_as: "setup_ok"
    

    - task:
        name: "analyze_modules"
        instruction: |
            Execute the following python code using the shell_run tool to discover the submodules of the provided task plan:
            ```bash
            python {{staging_dir}}/explore_submodule.py --yaml_plan_path {{yaml_plan_path}} --home-dir {{staging_dir}} --json
            ```
            Read the output of the command, and return a list of dict under the following format:
            ```json
            [
                {
                    "yaml_path": ..., 
                    "module_name": ..., 
                    "is_root": true/false, 
                    "child_names": [...]
                }, 
                ...
            ]
            ```
            You should return the list following the topological order obtained by the python script, and only return the raw list of dicts without any additional text and code blocks.
        save_as: "raw_module_results"
    
    - discover:
        name: "parsed_module_results"
        from: "{{raw_module_results}}"
        instruction: |
            Extract module information as a Json array of dicts. Each element in the array should be like:
            ```json
            {
                "yaml_path": ..., 
                "module_name": ..., 
                "is_root": true/false, 
                "child_names": [...]
            }
            ```
    
    - for_each:
        variable: "module_info"
        in: "parsed_module_results"
        steps:

            - step:
                name: "extract_module_name"
                instruction: |
                    Analyze the module name from the following JSON information:
                    ```json
                    {{module_info}}
                    ```
                    Extract the "module_name" field, and say only the module name without any additional text
                save_as: "module_name"

            - step:
                name: "transform_to_json"
                instruction: |
                    Execute the following python code using the shell_run tool to parse the yaml task plan into JSON format.

                    The module you should parse is:

                    ```json
                    {{module_info}}
                    ```

                    The following are the arguments you need to read from the module info:
                    - path_of_the_module: the yaml_path field from the module info above.
                    - output_json_path: Replace the `/workspace/_verifier_staging/` prefix in yaml_path with `{{output_dir}}/`, and change the file name from `xxx.yaml` to `{{module_name}}.json`.
                      For example:
                        module_name = "search_citations"
                        yaml_path = `/workspace/_verifier_staging/demo/ai_scientists/writer/modules/search_citations_plan.yaml`
                        output_json_path = `{{output_dir}}/demo/ai_scientists/writer/modules/search_citations.json`

                    The python code to execute using shell_run is:
                    ```bash
                    python {{staging_dir}}/yaml_parser.py --yaml_path <path_of_the_module> --output <output_json_path>
                    ```

                    Note: Both arguments are required named flags (--yaml_path and --output). The output directory will be created automatically.

                    After executing the code, say the FULL ABSOLUTE PATH of the generated JSON file, and ONLY the path, without any additional text.
                save_as: "saved_json_path"

            - step:
                name: "layer1_transform"
                instruction: |
                    Execute the following python code using the shell_run tool to transform the JSON file generated in the previous step into the Layer 1 static structural verification format:

                    The following are the arguments you need to read from the previous steps:
                    - output_path: Replace the `.json` suffix in {{saved_json_path}} with `_layer1.lean`.
                    - intermediate_representation_path: Change the name of json file in {{saved_json_path}} from `{{module_name}}.json` to `{{module_name}}_layer1_ir.json`, and keep it in the same directory.
                    - env_path: The path for the env variable, it should be in the same opsition as the <path_of_the_module> but replace the suffix from `.yaml` to `.env`.

                    ```bash
                    python {{staging_dir}}/TaskPlanToLean.py --json_path {{saved_json_path}} --prefix {{module_name}} --output <output_path> --save_ir <intermediate_representation_path> --env_file  <env_path>
                    ```

                    After executing the code, say the FULL ABSOLUTE PATH of the generated Layer 1 IR Json file (i.e., <intermediate_representation_path>), and ONLY the path, without any additional text.
                save_as: "intermediate_representation_path"

            - step:
                name: "count_parameters"
                instruction: |
                    Extract the number of parameters used in the module from the IR JSON file generated in the previous step. You can use the following command to get the number of parameters:

                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["parameters"]' --get | python3 -c "import json,sys; print(len(json.load(sys.stdin)))"
                    ```

                    In the final answer, you should only answer the number of parameters without any additional text.
                save_as: "number_of_parameters"

            - set_variable:
                name: "i"
                value: 0
            
            # Analyze the parameter's predicates information
            - while:
                condition: "i < number_of_parameters"
                steps:
                    - task:
                        name: "obtain_parameter_info"
                        instruction: |
                            Extract the information of the parameter with the index `i` from the IR file using the following command:

                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["parameters", {{i}}]' --get
                            ```

                            You should read out the extracted json information as a dict without any additional text. 

                        save_as: "parameter_info"

                    - task:
                        name: "analyze_predicate_for_parameter"
                        instruction: |
                            Your task is to analyze predicates for a parameter and EXECUTE the edit command using shell_run.

                            **Predicate reference guide:**
                            ```md
                            {{verification_system_use_guide}}
                            ```

                            **Advanced predicates usage guide:**
                            ```md
                            {{advanced_predicate_usages}}
                            ```

                            **Parameter to analyze:**
                            ```json
                            {{parameter_info}}
                            ```

                            Follow these steps IN ORDER, executing each command via term_call:

                            **Step 1**: Analyze the parameter value and determine which predicate(s) from the guide are satisfied. Pick the strongest applicable predicate(s). Format them as a JSON list like `[{"kind":"isValidURL"}]`.

                            **Step 2**: EXECUTE this command using shell_run to write the predicates into the IR JSON (replace <list_of_dict_predicates> with your actual JSON list from Step 1):
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["parameters", {{i}}, "predicates"]' --set '<list_of_dict_predicates>'
                            ```
                            IMPORTANT: You MUST actually run this command using the term_call tool, not just print it.

                            **Step 3**: EXECUTE this verification command to confirm the edit:
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["parameters", {{i}}, "predicates"]' --get
                            ```

                            **Step 4**: If the verification shows the correct predicates, say "Predicate edit successful". Otherwise retry Steps 2-3 up to 3 times, then say "Predicate edit failed, moving on".
                    - increment: "i"
            
            # Analyze the node information
            - step:
                name: "count_nodes"
                instruction: |
                    Extract the number of nodes in the workflow graph from the IR JSON file generated in the previous step. You can use the following command to get the number of nodes:

                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes"]' --get | python3 -c "import json,sys; print(len(json.load(sys.stdin)))"
                    ```

                    In the final answer, you should only answer the number of nodes without any additional text.
                save_as: "number_of_nodes"

            # ============================================================
            # GOAL DECOMPOSITION: 3 focused substeps
            # Must happen BEFORE per-node analysis so the LLM knows
            # sub-goal names when annotating nodes
            # ============================================================

            # Substep 1: Analyze workflow structure
            - step:
                name: "analyze_workflow_structure"
                instruction: |
                    Read the entire IR JSON and produce a structural summary of the workflow.

                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '[]' --get
                    ```

                    After reading, produce a summary in EXACTLY this format:

                    ```
                    GOAL: <the workflow goal from the IR>
                    TOTAL_NODES: <number>
                    EXIT_NODES: <list of exit node IDs>

                    LOOPS:
                    - loop_header: <node_id>, body_nodes: [<node_ids inside this loop>]
                    (or "None" if no loops)

                    BRANCHES:
                    - condition_node: <node_id>, then_branch: [<node_ids>], else_branch: [<node_ids>]
                    (or "None" if no branches)

                    KEY_VARIABLES:
                    - <var_name>: written by node(s) [<ids>], on path(s): <linear|loop|branch_true|branch_false>
                    ```

                    This summary will be used by subsequent steps to make informed decisions.
                save_as: "workflow_structure_summary"

            # Substep 2: Identify sub-goals with predicates
            - step:
                name: "identify_sub_goals"
                instruction: |
                    Based on the workflow structure, decompose the goal into sub-goals.

                    **Workflow structure:**
                    {{workflow_structure_summary}}

                    For each sub-goal, determine:
                    1. `name` — short identifier (e.g., "issue_understood", "fix_implemented")
                    2. `variable_name` — the variable that holds evidence for this sub-goal
                    3. `description` — human-readable explanation
                    4. `required_predicate` — what the variable must satisfy

                    **Rules for `required_predicate`** (MUST be from this list):
                    - `{"kind": "nameExists"}` — variable exists (weakest)
                    - `{"kind": "isNonEmptyString"}` — non-empty string (most common)
                    - `{"kind": "isInt"}` — integer value
                    - `{"kind": "containsSubstring", "substring": "..."}` — contains substring
                    - `{"kind": "isValidJson"}`, `{"kind": "isValidURL"}`, etc.

                    **DO NOT invent predicates** (e.g., `isExactly`, `isBoolean` do NOT exist).

                    **Predicate strength rule**: The predicate must be satisfiable on ALL exit paths.
                    - Variable always written with meaningful content → `isNonEmptyString`
                    - Variable written on all paths but with different values → `nameExists`
                    - Variable only written on success path → `nameExists`

                    Output the sub-goals as a JSON list in this format:
                    ```json
                    [
                      {"name": "...", "variable_name": "...", "description": "...",
                       "required_predicate": {"kind": "..."}, "required_graph_predicates": []},
                      ...
                    ]
                    ```
                    Leave `required_graph_predicates` as `[]` for now — it will be filled in the next step.
                save_as: "identified_sub_goals"

            # Substep 3: Assign graph-level requirements and write goal_spec
            - step:
                name: "assign_graph_requirements"
                instruction: |
                    Assign `required_graph_predicates` to each sub-goal based on the
                    **inherent nature of the task goal**, then write the final goal_spec
                    to the IR JSON.

                    **Workflow structure (for reference only — do NOT base requirements on plan topology):**
                    {{workflow_structure_summary}}

                    **Sub-goals identified:**
                    {{identified_sub_goals}}

                    **Graph-level predicate catalog:**
                    {{graph_predicate_catalog}}

                    For each sub-goal, reason about whether its nature is non-deterministic
                    (needs retry) or produces a verifiable artifact (needs verification).
                    Base your decision on the TASK GOAL, not on what the plan implements.
                    If the task inherently needs retry but the plan has no loop, that is a
                    correct finding — assign the predicate anyway.

                    Now fill in `required_graph_predicates` for each sub-goal and write
                    the complete goal_spec:

                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["goal_spec"]' --set '<complete_goal_spec_json>'
                    ```

                    Verify by reading back:
                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["goal_spec"]' --get
                    ```

                    If correct, say "Goal decomposition complete".

            # Initialize empty lists for per-node graph annotations
            # (will be appended to during the per-node while loop)
            - step:
                name: "init_graph_annotation_lists"
                instruction: |
                    Initialize empty lists for graph-level per-node annotations in the IR JSON.
                    Run these commands using shell_run:

                    ```bash
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["step_tags"]' --set '[]'
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["write_contexts"]' --set '[]'
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["sub_goal_contributions"]' --set '[]'
                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["sub_goal_verifications"]' --set '[]'
                    ```

                    Say "Initialization complete".

            - set_variable:
                name: "i"
                value: 0

            # Analyze the nodes' semantic predicates one by one
            # NOTE: goal_spec is already available from the previous step,
            # so per-node analysis can reference sub-goal names
            - while:
                condition: "i < number_of_nodes"
                steps:

                    # Read the node information
                    - task:
                        name: "obtain_node_info"
                        instruction: |
                            Extract the information of the node with the index `i` from the IR file using the following command:

                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes", {{i}}]' --get
                            ```

                            You should read out the extracted json information as a dict without any additional text.
                        save_as: "node_info"

                    # Compute execution-time information visibility for this node
                    - task:
                        name: "compute_node_visibility"
                        instruction: |
                            Run the following command to compute what information this node
                            can access at execution time:

                            ```bash
                            python {{staging_dir}}/TaskPlanToLean.py --from_ir {{intermediate_representation_path}} --node_visibility {{i}}
                            ```

                            Output the JSON result verbatim, without any additional text.
                        save_as: "node_visibility_context"

                    - task:
                        name: "analyze_predicate_basic"
                        instruction: |
                            Your task is to analyze predicates for the read, write, and additional parameters of a node and execute the edit command using shell_run.

                            **Predicate reference guide:**
                            ```md
                            {{verification_system_use_guide}}
                            ```

                            **Advanced predicate use guide:**
                            ```md
                            {{advanced_predicate_usages}}
                            ```

                            **JSON update guide**
                            ```md
                            {{node_json_update_guide}}
                            ```
                            
                            **Node to analyze:**
                            ```json
                            {{node_info}}
                            ```

                            **IMPORTANT:**
                                1. Json dict usage:
                                    If in anywhere you would write a `isValidJson` predicate for a variable, you should also look into the instruction to check the potential JSON schema for this variable. If you can infer a JSON schema, you should also add a `matchesJsonSchema` predicate with the inferred schema. For example, if the instruction contains "the output should be a JSON dict with keys 'name' and 'age'", then you can infer the following JSON schema for the variable:

                                    ```json
                                    {
                                        "kind": "jObject",
                                        "fields": {
                                            "name": {"kind": "jString"},
                                            "age": {"kind": "jNumber"}
                                        }
                                    }
                                    ```

                                    Then you should add the following predicate for the variable:

                                    ```json
                                    {
                                        "kind": "matchesJsonSchema",
                                        "schema": {
                                            "kind": "jObject",
                                            "fields": {
                                                "name": {"kind": "jString"},
                                                "age": {"kind": "jNumber"}
                                            }
                                        }
                                    }
                                    ```

                                    If you are unable to directly identify the json schema in the instruction or you are currently analyze an return variable, use the following command to read entire node information and try to infer the potential JSON schema based on all the information you have about this node:

                                    ```bash
                                    python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes"]' --get
                                    ```
                                2. Empty list handling: When encourting an empty list such as `[]`, you can parse it as a list of string.

                            Following these steps in order to analyze the node we provided above:

                                1. Based on the `instruction` field of the node and predicate guide, analysis what is this node plan to do to have a general understanding of the node's functionality.

                                2. For the `reads` field of the node info, analyze based on the isntruction and predicate guide to determine what are the predicates that the node needs to satisfy for each read variable. Reformat the `reads` fields with predicate information as follows:
                                    1. Before predicate information:
                                        ```json
                                        [
                                            {
                                            "name": "paper_title", "base_type": "TString"
                                            },
                                            {
                                            "name": "url", "base_type": "TString"
                                            }
                                        ]
                                        ```
                                    2. After predicate information:
                                        ```json
                                        [
                                            {
                                            "name": "paper_title", "base_type": "TString",
                                            "predicates": [{"kind": "isNonEmptyString"}]
                                            },
                                            {
                                            "name": "url", "base_type": "TString",
                                            "predicates": [{"kind": "isValidURL"}]
                                            }
                                        ]
                                        ```
                                Then execute the following command using shell_run to write the predicates into the IR JSON (replace <updated_reads_with_predicates> with your actual JSON list):

                                ```bash
                                python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes", {{i}}, "reads"]' --set '<updated_reads_with_predicates>'
                                ```

                                3. For the `writes` field of the node info, add predicates to EACH EXISTING write variable.
                                **CRITICAL: You must ONLY add predicates to variables that ALREADY exist in the `writes` list. Do NOT invent or add new write variables.** The writes list comes from the original YAML task plan (e.g., `save_as` fields). If `writes` is `[]`, it must stay `[]` — do NOT add variables just because the instruction mentions producing output. Implicit outputs (e.g., files created on disk, terminal output) are NOT write variables.
                                For each existing write variable, analyze based on the instruction and predicate guide to determine what predicates the variable should satisfy after proper execution. Then reformat the `writes` field with predicate information. Then execute the following command using the shell_run to write predicates into IR JSON (replace <updated_writes_with_predicates> with your actual JSON list):

                                ```bash
                                python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes", {{i}}, "writes"]' --set '<updated_writes_with_predicates>'
                                ```

                                4. Additionally, add the potential tool information you can infer from the instruction and formulate a list of dict named <tool_information> of tools predicates such as follows:
                                ```json
                                [
                                    { "var_name": "get_abstract_from_url", "predicate": {"kind": "toolExists"} }
                                ]
                                ```
                                Then execute the following command using shell_run to write the tool predicates into the IR JSON:

                                ```bash
                                python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes", {{i}}, "precond_extra"]' --set '<tool_information>'
                                ```
                            If this is a node with step_type `conditional`, you also need to analyze the predicates for the `then` and `else` branches based on the node information and execute similar commands to write them into the IR JSON.

                            If this is a node with step_type `whileLoop` or `forEachLoop`, you also need to analyze the loop invariant and termination condition based on the node information and execute similar commands to write them into the IR JSON.

                            If this is a node with step_type `returnValue`, you also need to analyze the predicates for the return variable and execute similar commands to write them into the IR JSON.

                            If this is a node with step_type `setVariable` or `incrementVariable`, you also need to analyze the predicates for the variable being set or incremented and execute similar commands to write them into the IR JSON.

                            After you finish your modification, execute the following command to verify the edit:

                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["nodes", {{i}}]' --get
                            ```

                            If the edit is successful and the predicates are correctly added, say "Node predicate edit successful". Otherwise retry the edit up to 3 times, then say "Node predicate edit failed, moving on".

                    # ── Graph-level annotations: decomposed into 4 focused steps ──

                    # Step A: Read goal_spec once for reuse by contribution + verification steps
                    - task:
                        name: "read_goal_spec_for_node"
                        instruction: |
                            Read the goal specification from the IR JSON by running:

                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["goal_spec"]' --get
                            ```

                            Output the JSON result verbatim, without any additional text.
                        save_as: "goal_spec_json"

                    # Step B: Visibility assessment + Step tag + Write context
                    - task:
                        name: "annotate_step_tag_and_write_context"
                        instruction: |
                            Annotate this node with its step tag and write context.

                            **Node info:**
                            ```json
                            {{node_info}}
                            ```

                            **Execution-time information visibility:**
                            ```json
                            {{node_visibility_context}}
                            ```

                            ---

                            ## 0. Information Visibility Assessment (DO THIS FIRST)

                            Study the `node_visibility_context` above. This tells you EXACTLY what
                            information this node has access to at execution time. Your annotations
                            must be grounded in what the node can actually observe — not what its
                            instruction text claims.

                            Key rules:
                            - `has_conversation_history: false` → FRESH conversation. Cannot see
                              prior steps' tool calls, reasoning, or intermediate work. Only
                              receives `prev_output` (predecessor's final text summary).
                            - `has_conversation_history: true` → Shares conversation history with
                              all prior `task`-type steps in `prior_task_steps_in_history`.
                            - If predecessor `writes_vars` is empty AND `has_conversation_history`
                              is false → NO explicit data link to predecessor's work.

                            Write a brief "Visibility assessment:" line.

                            ---

                            ## 1. Step Tag

                            Assign a step tag ONLY if this node is a non-deterministic type
                            (`step`, `task`, `call`, `synthesize`, `discover`, `evaluate`, `validate`).
                            Skip for deterministic nodes (`setVariable`, `incrementVariable`,
                            `conditional`, `whileLoop`, `forEachLoop`, `switchBranch`, `returnValue`,
                            `save`, `input`, `parallel`, `gather`).

                            Available tags:
                            - `"exploratory"` — reads/explores but produces incomplete picture
                            - `"comprehensive"` — thorough investigation producing complete understanding
                            - `"incremental"` — builds on previous work, makes progress
                            - `"transformative"` — creates new artifact (code change, script, patch, submission)
                            - `"verificatory"` — checks/validates previous work
                            - `"overhead"` — pure infrastructure step

                            **Feasibility check for `"verificatory"` tag:**
                            A node can only be tagged `"verificatory"` if it can actually observe
                            the outcome of the work it claims to verify:
                            - Does it read a variable written by the node whose work it verifies? OR
                            - Does it have `has_conversation_history: true` with the producing node? OR
                            - Can it reliably discover the outcome through filesystem side effects
                              with **specific, targeted knowledge** of what to check?

                            **"Targeted knowledge" means knowledge of WHAT CHANGED, not just ability
                            to run tests.** A generic test command (`regression_test_cmd`, `pytest`)
                            is NOT targeted knowledge. Running tests without knowing what was modified
                            is black-box re-testing, not verification.

                            Targeted knowledge requires knowing the SPECIFIC changes made by a
                            predecessor (which files edited, what logic modified, what artifact produced).
                            This comes from: (a) an explicit variable, (b) conversation history with
                            the producing node, or (c) an external memory/knowledge system.

                            Common trap: instruction says "verify your fix" but `has_conversation_history:
                            false` — the node has NO memory of what "your fix" is. Tag `"incremental"`.

                            If applicable, append to step_tags:
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["step_tags"]' --list_append '{"node_id": {{i}}, "tag": "<chosen_tag>"}'
                            ```

                            ## 2. Write Context

                            For each variable this node writes, classify the write context:
                            - `"unconditional"` — always writes (default for linear flow)
                            - `"onSuccess"` — writes only on the success/true branch
                            - `"onFailure"` — writes only on the failure/false/else branch
                            - `"onExhaustion"` — writes INSIDE a loop body when retry limit is hit

                            **onFailure vs onExhaustion:** determined by IMMEDIATE control flow
                            structure, NOT upstream cause. `"onExhaustion"` is ONLY for writes
                            INSIDE a loop body that force a variable to exit the loop.

                            If the node has no write variables, skip this section.

                            For each written variable, append:
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["write_contexts"]' --list_append '{"node_id": {{i}}, "var_name": "<var>", "context": "<context>"}'
                            ```

                            ---

                            **IMPORTANT:** End your response with exactly one line in this format:
                            ```
                            STEP_TAG: <tag>
                            ```
                            where `<tag>` is the assigned tag (e.g., `verificatory`, `incremental`,
                            `transformative`) or `none` if this is a deterministic node that was skipped.
                        save_as: "step_tag_result"

                    # Step C: Sub-goal contribution mapping
                    - task:
                        name: "annotate_subgoal_contribution"
                        instruction: |
                            Determine which sub-goals this node contributes to.

                            **Node info:**
                            ```json
                            {{node_info}}
                            ```

                            **Execution-time visibility:**
                            ```json
                            {{node_visibility_context}}
                            ```

                            **Goal spec (available sub-goals):**
                            ```json
                            {{goal_spec_json}}
                            ```

                            ---

                            **IMPORTANT: Only non-deterministic nodes contribute to sub-goals.**
                            Deterministic nodes (`setVariable`, `incrementVariable`, `conditional`,
                            `whileLoop`, `forEachLoop`, `switchBranch`, `returnValue`, `save`,
                            `input`, `parallel`, `gather`) do NOT contribute. If this node is
                            deterministic, say "No contributions (deterministic node)" and stop.

                            **Feasibility check:** A contribution claim means this node produces
                            evidence for the sub-goal. The node must be able to actually produce
                            that evidence given its information visibility. For example:
                            - Contributing to "fix_verified" requires ability to run verification
                            - Contributing to "fix_implemented" requires access to codebase

                            **CRITICAL — Contribution vs Verification duality:**
                            A verificatory node typically has TWO roles:
                            - It **contributes** to its OWN sub-goal (e.g., produces evidence for `fix_verified`)
                            - It **verifies** a PREVIOUS sub-goal (e.g., checks that `fix_implemented` is correct)
                            These are DIFFERENT sub-goals. Annotate the contribution here; the
                            verification will be handled in the next step.

                            For each sub-goal this node contributes to, append:
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["sub_goal_contributions"]' --list_append '{"node_id": {{i}}, "sub_goal_name": "<name>"}'
                            ```

                            After all edits, say "Contribution annotations complete for node {{i}}".

                    # Step D: Sub-goal verification mapping (dedicated step to ensure full attention)
                    - task:
                        name: "annotate_subgoal_verification"
                        instruction: |
                            Determine whether this node **verifies** any previous sub-goal's outcome.

                            **Node info:**
                            ```json
                            {{node_info}}
                            ```

                            **Execution-time visibility:**
                            ```json
                            {{node_visibility_context}}
                            ```

                            **Goal spec:**
                            ```json
                            {{goal_spec_json}}
                            ```

                            **Step tag assigned to this node (from previous step):**
                            ```
                            {{step_tag_result}}
                            ```

                            ---

                            ## Applicability Check

                            This section applies when EITHER condition holds:
                            1. The step tag (above) is `"verificatory"`, OR
                            2. The node's **name** or **instruction** contains any of these
                               keywords: verify, test, check, validate, confirm, assert, ensure,
                               inspect, review, audit.

                            **If NEITHER condition holds, say "Verification annotation skipped
                            for node {{i}} (not applicable)" and stop.**

                            ---

                            ## Verification Annotation

                            A node CANNOT both contribute to AND verify the SAME sub-goal.
                            But it SHOULD contribute to one sub-goal (handled in the previous step)
                            and verify a DIFFERENT, earlier sub-goal.

                            **Feasibility check — verification IS feasible when:**

                            | Condition | Example |
                            |---|---|
                            | Node reads a variable written by X's contributing node | `readable_template_vars` includes X's output variable |
                            | Node has conversation history with X's contributing node | `has_conversation_history: true` AND contributing node is a `task` type in `prior_task_steps_in_history` |
                            | Node has **targeted knowledge of WHAT CHANGED** and can check mechanically | A variable carries the predecessor's output file path or diff |
                            | Node can query an external memory/knowledge system | Instruction or tools include memory retrieval for predecessor's actions |

                            **Verification is NOT feasible when:**
                            - `has_conversation_history: false` AND no explicit variable carrying
                              what the predecessor produced AND no external memory system
                            - The node only has a generic test command (`regression_test_cmd`,
                              `pytest`) but does NOT know what specific code changes were made.
                              Running tests blind is black-box re-testing, not verification.
                            - The node would need to independently explore the filesystem to
                              discover what changed (e.g., `git diff`, browse directories).
                              This is unbounded exploration, not verification.
                            - The instruction says "verify your fix" or "run your script again"
                              but `has_conversation_history: false` — the node does not know what
                              "your fix" or "your script" refers to.
                            - The node has general tool access but lacks knowledge of WHAT
                              SPECIFICALLY was changed. Having tools ≠ having knowledge.

                            If verification is not feasible, do NOT add an entry.

                            For each sub-goal this node verifies (after passing feasibility), append:
                            ```bash
                            python {{staging_dir}}/EditJson.py --json_path {{intermediate_representation_path}} --path '["sub_goal_verifications"]' --list_append '{"node_id": {{i}}, "sub_goal_name": "<name>"}'
                            ```

                            After all edits, say "Graph annotations complete for node {{i}}".

                    - increment: "i"

