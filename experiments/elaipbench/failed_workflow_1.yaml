name: "elaipbench_agent_failed_workflow_1"
goal: "Answer an academic paper question based on the provided passage"
system_prompt: |
  You are an expert academic researcher skilled at reading and understanding scientific papers. You answer questions about academic papers by carefully analyzing the provided passage. Be precise and select only the answer(s) that are supported by the passage.
config:
  model: "${MODEL_NAME}"
  temperature: 1.0
  max_tokens: 163840
  enabled_tools: []
  enable_inline_tool_calls: true
parameters:
  question: ""
  paper_content: ""
  question_type_instruction: ""
  question_type: ""

workflow:
  - task:
      name: skim_paper
      instruction: |
        Read the provided paper and write a brief overview.
        Identify the paper title and a 2-3 sentence abstract summary.

        Paper:
        {{paper_content}}

        Return JSON in the format:
        {
          "title": "",
          "abstract_summary": ""
        }
      save_as: paper_overview

  - task:
      name: extract_section_headings
      instruction: |
        Look at the paper below and list the main section headings exactly as
        they appear. Include numbered sections if present.

        Paper:
        {{paper_content}}

        Return a JSON array of strings, e.g. ["1. Introduction", "2. Methods", ...].
      save_as: section_headings

  - task:
      name: analyze_question
      instruction: |
        Use the paper overview and section headings below to ground the question.
        Paper overview: {{paper_overview}}
        Section headings: {{section_headings}}

        Analyze the question stem to determine what information must be found in
        the paper. Focus ONLY on the question stem. Do NOT evaluate or reason
        about the answer options yet.

        Question:
        {{question}}
        {{question_type_instruction}}

        If the question contains negation words (e.g., "NOT", "incorrect",
        "wrong", "false"), note this EXPLICITLY in your analysis.

        Identify:
        1. Key terms to search in the paper
        2. The EXACT focus of the question
        3. Whether the question contains negation

        Return JSON in the format:
        {
          "keywords": [],
          "core_claim": "",
          "question_stem": "",
          "negation": "yes or no"
        }
      save_as: question_analysis

  # was discover: (dropped in AgentSPEX) — stateless task reproducing the old engine's discover prompt; save_as keeps the same list variable
  - task:
      name: keywords
      instruction: |
        Source: question_analysis

        Task: Extract the keywords array from the question analysis as a clean JSON list of strings.

        Return ONLY a JSON array of strings, no extra text.
      save_as: keywords

  - set_variable:
      name: evidence_snippets
      value: "[]"

  - for_each:
      variable: "keyword"
      in: "keywords"
      limit: 5
      steps:
        - task:
            name: search_keyword_in_paper
            instruction: |
              Search the paper for paragraphs that contain or directly relate to
              the keyword: "{{keyword}}".

              Paper:
              {{paper_content}}

              Return up to 2 verbatim paragraphs that mention "{{keyword}}" or
              clearly discuss the same concept. Each paragraph must be copied
              VERBATIM from the paper. If there are no relevant paragraphs,
              return an empty list.

              Return JSON array in the format:
              [
                {"text": "...", "keyword": "{{keyword}}"}
              ]
            save_as: keyword_hits

        - set_variable:
            name: evidence_snippets
            value: "{{evidence_snippets}} + {{keyword_hits}}"

  - task:
      name: evaluate_A
      instruction: |
        Independently judge whether option A in the question is supported by
        the evidence below.

        Question: {{question}}
        Evidence: {{evidence_snippets}}

        Decide one of: supported, contradicted, not_established.
        Return JSON: {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""}
      save_as: judgment_A

  - task:
      name: evaluate_B
      instruction: |
        Independently judge whether option B in the question is supported by
        the evidence below. Do NOT let your verdict on option A influence this
        judgment — evaluate B on its own merits.

        Question: {{question}}
        Evidence: {{evidence_snippets}}

        Return JSON: {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""}
      save_as: judgment_B

  - task:
      name: evaluate_C
      instruction: |
        Independently judge whether option C in the question is supported by
        the evidence below. Do NOT let your verdicts on options A or B
        influence this judgment.

        Question: {{question}}
        Evidence: {{evidence_snippets}}

        Return JSON: {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""}
      save_as: judgment_C

  - task:
      name: evaluate_D
      instruction: |
        Independently judge whether option D in the question is supported by
        the evidence below. Do NOT let your verdicts on options A, B, or C
        influence this judgment.

        Question: {{question}}
        Evidence: {{evidence_snippets}}

        Return JSON: {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""}
      save_as: judgment_D

  - switch:
      variable: "question_type"
      cases:
        "MA-MCQ":
          - set_variable:
              name: recheck_count
              value: 0

          - while:
              condition: "recheck_count < 3"
              max_iterations: 3
              steps:
                - task:
                    name: aggregate_and_recheck
                    instruction: |
                      Look at the four independent option judgments below and
                      decide which options to select. This is a multi-answer
                      question and typically 2-3 options are correct.

                      A: {{judgment_A}}
                      B: {{judgment_B}}
                      C: {{judgment_C}}
                      D: {{judgment_D}}

                      Question: {{question}}
                      Evidence: {{evidence_snippets}}

                      If fewer than 2 options have verdict "supported",
                      reconsider non-selected options with a more lenient
                      standard. You MUST select at least 2 options.

                      Return JSON in the format:
                      {
                        "A": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
                        "B": {"verdict": "...", "reason": "", "evidence_text": ""},
                        "C": {"verdict": "...", "reason": "", "evidence_text": ""},
                        "D": {"verdict": "...", "reason": "", "evidence_text": ""},
                        "selected_options": [],
                        "selected_count": 0
                      }
                    save_as: option_judgment

                - increment: recheck_count

          - task:
              name: finalize_multi_answer
              instruction: |
                Based on the aggregated option evaluation below, select all
                correct answers.

                Question: {{question}}
                Option evaluation: {{option_judgment}}
                {{question_type_instruction}}
              save_as: final_response

        "SA-MCQ":
          - task:
              name: finalize_single_answer
              instruction: |
                Based on the four independent option judgments below, select
                the ONE correct answer.

                A: {{judgment_A}}
                B: {{judgment_B}}
                C: {{judgment_C}}
                D: {{judgment_D}}

                Question: {{question}}
                {{question_type_instruction}}
              save_as: final_response
