name: "elaipbench_passed_workflow_2"
goal: "Answer an academic paper question based on the provided passage"
system_prompt: |
  You are an expert academic researcher skilled at reading and understanding scientific papers. You answer questions about academic papers by carefully analyzing the provided passage. Be precise and select only the answer(s) that are supported by the passage.
config:
  model: "${MODEL_NAME}"
  temperature: 1.0
  max_tokens: 163840
  enabled_tools: []
  enable_inline_tool_calls: true
parameters:
  question: ""
  paper_content: ""
  question_type_instruction: ""
  question_type: ""

workflow:
  - task:
      name: skim_paper
      instruction: |
        Read the paper passage below and produce a compact overview that we will reuse as a navigation map for the rest of the workflow.

        Paper:
        {{paper_content}}

        Capture:
        1. The paper title.
        2. A one-paragraph summary of the abstract (or the opening section if no
           abstract is present).
        3. The ordered list of top-level section headings.

        Return JSON in the format:
        {
          "title": "",
          "abstract_summary": "",
          "section_headings": []
        }
      save_as: paper_overview

  - task:
      name: analyze_question
      instruction: |
        Analyze ONLY the question stem to determine what specific information must be found in the paper.
        Do **NOT** examine or reason about the four answer options yet.

        Paper overview (for orientation): {{paper_overview}}
        Question:
        {{question}}
        {{question_type_instruction}}

        If the question contains a negation cue (e.g. "NOT", "incorrect",
        "wrong", "false", "except"), note this EXPLICITLY.

        Identify:
        1. A short list of search keywords or phrases (3-7) to look for in the paper.
        2. The core claim — the exact focus of the question.
        3. Whether the question is single-answer (SA-MCQ) or multiple-answer (MA-MCQ).

        Return JSON:
        {
          "keywords": [],
          "core_claim": "",
          "question_stem": "",
          "negation_present": false,
          "question_type": "Single-answer or Multiple-answer"
        }
      save_as: question_analysis

  - task:
      name: extract_evidence
      instruction: |
        ## Context
        Question analysis: {{question_analysis}}
        Paper:
        {{paper_content}}

        ## Task
        Locate the most relevant evidence in the paper to address the core claim.
        Use the keywords from the question analysis to scan paragraphs.

        ### Rules
        - Return at most 5 evidence snippets.
        - Each snippet must be copied **VERBATIM** from the paper. Do not
          paraphrase or invent.
        - Each snippet must clearly relate to the core claim from the question
          analysis.
        - If fewer than 5 strong snippets exist, return only those.

        Return JSON:
        {
          "evidence_snippets": [
            {"text": "...", "reason": "why this snippet is relevant"}
          ]
        }
      save_as: evidence

  # was evaluate: (dropped in AgentSPEX) — stateless task reproducing the old engine's evaluate prompt; save_as stores the numeric score under the same name
  - task:
      name: evidence_quality
      instruction: |
        Rate the quality of the evidence collected for judging the answer
        options.

        Evidence: {{evidence}}
        Core claim: {{question_analysis.core_claim}}

        Score from 0.0 to 1.0 considering:
        - Coverage: do the snippets address all sides of the core claim?
        - Specificity: are the snippets directly on-topic, or only tangentially
          related?
        - Verbatim fidelity: do the snippets read as if copied from the paper?

        Return ONLY a single floating-point number between 0.0 and 1.0.

        Return ONLY a number between 0 and 1 with at most 2 decimals.
      save_as: evidence_quality

  - if:
      condition: "evidence_quality < 0.6"
      then:
        - task:
            name: rebroaden_evidence
            instruction: |
              The current evidence was scored {{evidence_quality}}, which is
              below the threshold of 0.6. Re-extract evidence using a broader
              search — include synonyms and related terminology of the
              keywords, and consider sections of the paper you may have skipped
              the first pass.

              Question analysis: {{question_analysis}}
              Previous evidence: {{evidence}}
              Paper:
              {{paper_content}}

              Same rules as before:
              - At most 5 snippets.
              - Each snippet copied **VERBATIM** from the paper.
              - Each snippet clearly relates to the core claim.

              Return JSON in the same shape as the previous evidence:
              {
                "evidence_snippets": [
                  {"text": "...", "reason": "why this snippet is relevant"}
                ]
              }
            save_as: evidence

  - task:
      name: evaluate_options
      instruction: |
        Evaluate each of the four answer options (A, B, C, D) using the
        evidence below. Make each verdict an **INDEPENDENT** judgment — your
        verdict on one option must NOT influence your verdict on any other
        option.

        Question: {{question}}
        Question analysis: {{question_analysis}}
        Evidence: {{evidence}}

        The question analysis identified this as: {{question_analysis.question_type}}.
          - Single-answer: typically exactly ONE option should be "supported".
          - Multiple-answer: typically 2-3 options should be "supported".

        For each option, decide:
          1. verdict: "supported" / "contradicted" / "not_established"
          2. reason: short justification grounded in the evidence
          3. evidence_text: the snippet from {{evidence}} most relevant to this option

        Return JSON in the format:
        {
          "A": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
          "B": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
          "C": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
          "D": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
          "selected_options": ["list of letters with verdict 'supported'"],
          "selected_count": 0
        }

        Rules:
        - "supported" = directly stated, paraphrased, or reasonably inferred from the evidence.
        - "contradicted" = the evidence directly opposes the option.
        - "not_established" = evidence is insufficient.
        - Do not guess beyond the evidence.
      save_as: option_judgment

  - if:
      condition: "question_type == 'MA-MCQ'"
      then:
        - set_variable:
            name: recheck_count
            value: 0

        - while:
            condition: "option_judgment.selected_count < 2 and recheck_count < 2"
            max_iterations: 2
            steps:
              - task:
                  name: recheck_options
                  instruction: |
                    This is a multiple-answer question (typically 2-3 correct),
                    but only {{option_judgment.selected_count}} option(s) were
                    selected so far.

                    Question: {{question}}
                    Current evaluation: {{option_judgment}}
                    Evidence: {{evidence}}

                    Reconsider every non-selected option with a more lenient
                    standard. Reasonable inference from the evidence is
                    acceptable. **You MUST end with at least 2 supported
                    options.**

                    Return JSON in the same shape as the original evaluation:
                    {
                      "A": {"verdict": "supported / contradicted / not_established", "reason": "", "evidence_text": ""},
                      "B": {"verdict": "...", "reason": "", "evidence_text": ""},
                      "C": {"verdict": "...", "reason": "", "evidence_text": ""},
                      "D": {"verdict": "...", "reason": "", "evidence_text": ""},
                      "selected_options": [],
                      "selected_count": 0
                    }
                  save_as: option_judgment

              - increment: recheck_count

  - task:
      name: finalize_response
      instruction: |
        Produce the final answer.

        Question: {{question}}
        Question type: {{question_type}}
        Option evaluation: {{option_judgment}}
        {{question_type_instruction}}

        For SA-MCQ, return exactly one option letter in the requested format.
        For MA-MCQ, list every option letter with verdict "supported", in
        alphabetical order, in the requested format.
      save_as: final_response
